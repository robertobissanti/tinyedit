# Nunjucks (.njk) -- template Eleventy/Nunjucks.
#
# Un .njk e' HTML con dentro un'altra lingua: base_tokenizer = xml fa
# evidenziare tag e attributi dal tokenizer di markup, e
# template_delimiters aggiunge sopra i blocchi {{ ... }} / {% ... %}.
# Senza la base xml si otterrebbero i tag HTML non colorati, che in un
# template e' la maggior parte del file.
extensions = njk,nunjucks
filetype = Nunjucks

base_tokenizer = xml

# Coppie "apertura chiusura", separate da virgola. Una coppia che apre
# con {# e' il commento della lingua e viene colorata come tale.
template_delimiters = {{ }}, {% %}, {\# \#}
