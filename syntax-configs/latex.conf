# LaTeX syntax for tinyedit (approximate: C-like tokenizer with LaTeX
# extensions -- no real {}/[] argument-structure parsing, but commands,
# comments, and inline/display math are recognized).
extensions = tex,latex,sty,cls
keywords = \begin,\end,\documentclass,\usepackage,\section,\subsection,\subsubsection,\paragraph,\chapter,\part,\label,\ref,\cite,\footnote,\item,\newcommand,\renewcommand,\newenvironment,\input,\include,\bibliography,\bibliographystyle,\maketitle,\author,\title,\date,\tableofcontents,\textbf,\textit,\emph,\underline,\caption,\includegraphics
quote_chars =
line_comment = %
keyword_prefix_chars = \
math_mode = true

filetype = LaTeX
