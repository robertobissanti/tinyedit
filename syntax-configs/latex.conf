# LaTeX syntax for tinyedit (approximate: C-like tokenizer with LaTeX
# extensions -- no real {}/[] argument-structure parsing, but commands,
# comments, and inline/display math are recognized).
extensions = tex,latex,sty,cls
keywords = \begin,\end,\documentclass,\usepackage,\section,\subsection,\subsubsection,\paragraph,\subparagraph,\chapter,\part,\label,\ref,\pageref,\eqref,\cite,\footnote,\item,\newcommand,\renewcommand,\newenvironment,\input,\include,\bibliography,\bibliographystyle,\addbibresource,\printbibliography,\maketitle,\author,\title,\date,\tableofcontents,\listoffigures,\listoftables,\textbf,\textit,\emph,\underline,\caption,\includegraphics,\centering,\raggedright,\raggedleft,\vspace,\hspace,\vfill,\hfill,\newpage,\clearpage,\pagebreak,\url,\href,\textsl,\textsc,\texttt,\textsf,\textrm,\tiny,\scriptsize,\footnotesize,\small,\normalsize,\large,\Large,\LARGE,\huge,\Huge,\color,\textcolor,\colorbox,\setstretch,\pagenumbering,\pagestyle,\thispagestyle,\appendix,\def,\let,\RequirePackage,\ProvidesPackage,\ProvidesClass,\DeclareOption,\ProcessOptions,\ExecuteOptions,\OptionNotUsed,\PassOptionsToPackage,\PassOptionsToClass,\LoadClass,\AtBeginDocument,\AtEndDocument,\newif,\if,\else,\fi,\ifx,\ifcase,\or,\ifdefined,\ifundefined,\ifnum,\ifdim,\ifvoid,\ifhbox,\ifvbox,\iftrue,\iffalse,\newcounter,\setcounter,\addtocounter,\value,\stepcounter,\refstepcounter,\ifthenelse,\equal,\isundefined
quote_chars =
line_comment = %
keyword_prefix_chars = \
math_mode = true

filetype = LaTeX
