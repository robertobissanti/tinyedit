# Basic Vimscript highlighting, using tinyedit's generic tokenizer.
# Double quotes are comments here; Vim's context-dependent double-quoted
# strings, command abbreviations and legacy/Vim9 differences need a parser.
extensions = vim,vimrc,gvimrc
filetype = Vim
keywords = let,const,var,final,unlet,lockvar,unlockvar,set,setlocal,setglobal,if,elseif,else,endif,for,endfor,while,endwhile,try,catch,finally,endtry,throw,function,endfunction,return,call,execute,echo,echom,echomsg,echoerr,echon,source,runtime,finish,autocmd,augroup,command,map,nmap,vmap,xmap,smap,omap,imap,lmap,cmap,tmap,noremap,nnoremap,vnoremap,xnoremap,snoremap,onoremap,inoremap,lnoremap,cnoremap,tnoremap,unmap,nunmap,iunmap,colorscheme,syntax,highlight,filetype,packadd,Plug,plugin
quote_chars = '
line_comment = "
highlight_function_calls = true
