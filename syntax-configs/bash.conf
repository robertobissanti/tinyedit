# Bash: generic tokenizer, not a full shell parser.
# Heredocs and nested expansions are not parsed specially.
extensions = sh,bash,bashrc,bash_profile,bash_login,bash_logout,profile,zshrc,zshenv,zprofile,zlogin,zlogout
filetype = Shell
keywords = if,then,else,elif,fi,for,while,until,do,done,case,esac,function,in,select,time,coproc,return,break,continue,local,export,readonly,declare,typeset,unset,shift,exit,trap,source,eval,alias,unalias,bg,bind,builtin,caller,cd,command,compgen,complete,compopt,dirs,disown,echo,enable,exec,false,fc,fg,getopts,hash,help,history,jobs,kill,let,logout,mapfile,popd,printf,pushd,pwd,read,readarray,set,shopt,suspend,test,times,true,type,ulimit,umask,wait
quote_chars = '"
line_comment = \#
highlight_function_calls = true
