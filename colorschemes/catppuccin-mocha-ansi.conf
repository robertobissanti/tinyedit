# ANSI approximation; actual shades follow the terminal palette.
color_mode = ansi
color_background = terminal-default
color_gutter = white-dim
color_selection = magenta-dark
color_statusbar = blue-dark
color_statusbar_text = white-light
color_invisibles = white-dim
color_syntax_normal = white-dark
color_syntax_keyword = magenta-light
color_syntax_string = green-light
color_syntax_json_key = blue-light
color_syntax_bracket = white-dim
color_syntax_comment = white-dim
color_syntax_number = yellow-light
color_syntax_preprocessor = blue-light
color_syntax_function = blue-light
color_syntax_emphasis_strong = yellow-light
color_syntax_math = cyan-light
markdown_heading_reverse = false

color_syntax_italic = white-dark
