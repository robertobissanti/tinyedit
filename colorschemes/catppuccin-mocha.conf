# Catppuccin Mocha, adapted to tinyedit color roles.
# Palette: https://github.com/catppuccin/catppuccin
color_mode = rgb
rgb_output = truecolor
rgb_background = #1E1E2E
rgb_gutter = #7F849C
rgb_selection = #45475A
rgb_statusbar = #181825
rgb_statusbar_text = #A6ADC8
rgb_invisibles = #6C7086
rgb_syntax_normal = #CDD6F4
rgb_syntax_keyword = #CBA6F7
rgb_syntax_string = #A6E3A1
rgb_syntax_json_key = #89B4FA
rgb_syntax_bracket = #9399B2
rgb_syntax_comment = #7F849C
rgb_syntax_number = #FAB387
rgb_syntax_preprocessor = #B4BEFE
rgb_syntax_function = #89B4FA
rgb_syntax_emphasis_strong = #FAB387
rgb_syntax_math = #94E2D5
rgb_markdown_heading_background = #2D2E43

rgb_syntax_italic = #CDD6F4
