# Synthwave Pro, terminal adaptation of Roberto Bissanti’s Obsidian theme.
# Source: https://github.com/robertobissanti/obsidian-synthwave-pro/blob/main/theme.css
# Default Synthwave dark palette; heading background is cyan at 12% over editor.
# MIT license: see LICENSE-THIRD-PARTY.
color_mode = rgb
rgb_output = truecolor

rgb_background = #1A1530
rgb_gutter = #A89FCF
rgb_selection = #3A2E63
rgb_statusbar = #14101F
rgb_statusbar_text = #A89FCF
rgb_invisibles = #6F6695
rgb_syntax_normal = #ECE6FF
rgb_syntax_keyword = #B56CFF
rgb_syntax_string = #FFD23F
rgb_syntax_json_key = #B56CFF
rgb_syntax_bracket = #FFD23F
rgb_syntax_comment = #A89FCF
rgb_syntax_number = #5EEAD4
rgb_syntax_preprocessor = #36E2EC
rgb_syntax_function = #36E2EC
rgb_syntax_emphasis_strong = #FF3EC8
rgb_syntax_math = #36E2EC
rgb_markdown_heading_background = #1D2E47
rgb_syntax_italic = #B56CFF
rgb_link_hover = #36E2EC
