# One (dark), adapted for tinyedit from rakr/vim-one.
# Reference: https://github.com/rakr/vim-one/blob/master/colors/one.vim
# All configurable RGB color roles are included. tinyedit groups syntax
# differently from Vim, so some Vim highlight groups share one color here.
color_mode = rgb
rgb_output = truecolor

rgb_background = #282C34
rgb_gutter = #4B5263
rgb_selection = #3E4452
rgb_statusbar = #2C323C
rgb_statusbar_text = #ABB2BF
rgb_invisibles = #3B4048

rgb_syntax_normal = #ABB2BF
rgb_syntax_keyword = #C678DD
rgb_syntax_string = #98C379
rgb_syntax_json_key = #E06C75
rgb_syntax_bracket = #E5C07B
rgb_syntax_comment = #5C6370
rgb_syntax_number = #D19A66
rgb_syntax_preprocessor = #61AFEF
rgb_syntax_function = #61AFEF
rgb_syntax_table_delimiter = #61AFEF
rgb_syntax_emphasis_strong = #DE4000
rgb_syntax_math = #D19A66

# Personal Vim overrides: orange-red bold, orange math, blue preprocessor.
# This legacy heading background also enables the per-level foreground tint.
rgb_markdown_heading_background = #354151

rgb_syntax_italic = #D19A67

# Compact Markdown links under the mouse pointer.
rgb_link_hover = #56B6C2

# Markdown heading levels H1 through H6.
rgb_markdown_h1 = #E06C75
rgb_markdown_h2 = #61AFEF
rgb_markdown_h3 = #C678DD
rgb_markdown_h4 = #E5C07B
rgb_markdown_h5 = #98C379
rgb_markdown_h6 = #56B6C2
