# One (dark), adapted for tinyedit from rakr/vim-one.
# Reference: https://github.com/rakr/vim-one/blob/master/colors/one.vim
# All configurable RGB color roles are included. tinyedit groups syntax
# differently from Vim, so some Vim highlight groups share one color here.
color_mode = rgb
rgb_output = truecolor

rgb_background = #282C34
rgb_gutter = #4B5263
rgb_selection = #3E4452
rgb_statusbar = #2C323C
rgb_statusbar_text = #ABB2BF
rgb_invisibles = #3B4048

rgb_syntax_normal = #ABB2BF
rgb_syntax_keyword = #C678DD
rgb_syntax_string = #98C379
rgb_syntax_json_key = #E06C75
rgb_syntax_bracket = #ABB2BF
rgb_syntax_comment = #5C6370
rgb_syntax_number = #D19A66
rgb_syntax_preprocessor = #E5C07B
rgb_syntax_function = #61AFEF
rgb_syntax_emphasis_strong = #E5C07B
rgb_syntax_math = #56B6C2

# Heading text shares rgb_syntax_preprocessor. The background is an
# adaptation using One's cursor-line color, not Vim's reverse-video style.
rgb_markdown_heading_background = #2C323C
